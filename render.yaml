services:
  - type: web
    name: ashish-spidey-api
    runtime: docker
    plan: free
    repo: https://github.com/Ashish241/PortFolio
    branch: new-spiderman-portfolio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    # TEMPORARY: one diagnostic deployment, then remove this override.
    dockerCommand: python -m app.diagnose_resend --confirm-live-send
    healthCheckPath: /api/ready
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://port-folio-delta-wine.vercel.app,https://port-folio-git-new-spiderman-portfolio-ashish241s-projects.vercel.app
      - key: FRONTEND_URL
        value: https://port-folio-delta-wine.vercel.app
      - key: AI_PROVIDER
        value: groq
      - key: AI_MODEL
        value: llama-3.1-8b-instant
      - key: ASSISTANT_MODE
        value: auto
      - key: DATABASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: IP_HASH_SECRET
        generateValue: true
      - key: CONTACT_RECEIVER_EMAIL
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
