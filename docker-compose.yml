services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      portfolio:
        ipv4_address: 172.29.10.4
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-portfolio}
      IP_HASH_SECRET: ${IP_HASH_SECRET:?Set IP_HASH_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      ENVIRONMENT: production
      TRUSTED_PROXY_IPS: 172.29.10.2
      ASSISTANT_MODE: ${ASSISTANT_MODE:-auto}
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      AI_API_KEY: ${AI_API_KEY:-}
      CONTACT_RECEIVER_EMAIL: ${CONTACT_RECEIVER_EMAIL:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      AI_MODEL: ${AI_MODEL:-llama-3.1-8b-instant}
      ASSISTANT_RATE_LIMIT: ${ASSISTANT_RATE_LIMIT:-30}
      ASSISTANT_SESSION_LIMIT: ${ASSISTANT_SESSION_LIMIT:-30}
      ASSISTANT_TIMEOUT_SECONDS: ${ASSISTANT_TIMEOUT_SECONDS:-15}
      ASSISTANT_WINDOW_SECONDS: ${ASSISTANT_WINDOW_SECONDS:-3600}
      ASSISTANT_SESSION_TTL_SECONDS: ${ASSISTANT_SESSION_TTL_SECONDS:-1800}
      ASSISTANT_MAX_SESSIONS: ${ASSISTANT_MAX_SESSIONS:-500}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/ready")']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      portfolio:
        ipv4_address: 172.29.10.3
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        SITE_URL: ${SITE_URL:-http://localhost:8080}
    ports:
      - '${FRONTEND_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      portfolio:
        ipv4_address: 172.29.10.2
volumes:
  postgres_data:
networks:
  portfolio:
    ipam:
      config:
        - subnet: 172.29.10.0/24
